name: CI-CD

permissions:
  id-token: write
  contents: read
on:
  push:

jobs:

  # =========================
  # CI
  # =========================
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'


      - name: Build application
        run: |
          mkdir build
          cp app.py build/
          cp requirements.txt build/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: my-application
          path: build/


  # =========================
  # DEV
  # =========================
  deploy-dev:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: my-application
          path: deploy/

      - name: Deploy to DEV
        run: |
          echo "Deploying application to DEV..."
          ls -R deploy/
          echo "DEV deployment successful!"


  # =========================
  # UAT
  # =========================
  deploy-uat:
    needs: deploy-dev
    runs-on: ubuntu-latest

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: my-application
          path: deploy/

      - name: Deploy to UAT
        run: |
          echo "Deploying application to UAT..."
          ls -R deploy/
          echo "UAT deployment successful!"


  # =========================
  # PROD
  # =========================
  deploy-prod:
    needs: deploy-uat
    runs-on: ubuntu-latest
    environment: 
       name: PROD

    steps:

      - name: Azure Login
        uses: azure/login@v2
        with: 
          client-id: ${{ secrets.AZURE_CLIENT_ID  }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
    
      - name: Verify Azure context
        run: |
          echo "=== Azure Account ==="
          az account show \
             --query "{subscriptionName:name, subscriptionId:id, tenantId:tenantId}" \
             -o table

          echo "=== App Service ==="
          az webapp show \
            --name Swshank \
            --resource-group rg-devops-learning \
            --query "{name:name, resourceGroup:resourceGroup, state:state}" \
            -o table

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: my-application
          path: deploy/

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
           app-name: ${{ vars.APP_NAME }}
           resource-group-name: rg-devops-learning
           package: ./deploy
