name: CI-CD

permissions:
  id-token: write
  contents: read
on:
  push:

jobs:

  # =========================
  # CI
  # =========================
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run tests
        run: |
          python -m pip install pytest
          pytest

      - name: Build application
        run: |
          mkdir build
          cp app.py build/
          cp test_app.py build/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: my-application
          path: build/


  # =========================
  # DEV
  # =========================
  deploy-dev:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: my-application
          path: deploy/

      - name: Deploy to DEV
        run: |
          echo "Deploying application to DEV..."
          ls -R deploy/
          echo "DEV deployment successful!"


  # =========================
  # UAT
  # =========================
  deploy-uat:
    needs: deploy-dev
    runs-on: ubuntu-latest

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: my-application
          path: deploy/

      - name: Deploy to UAT
        run: |
          echo "Deploying application to UAT..."
          ls -R deploy/
          echo "UAT deployment successful!"


  # =========================
  # PROD
  # =========================
  deploy-prod:
    needs: deploy-uat
    runs-on: ubuntu-latest
    environment: 
       name: PROD

    steps:

      - name: Azure Login
        uses: azure/login@v2
        with: 
          client-id: ${{ vars.AZURE_CLIENT_ID  }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBCRPTION_ID }}
 
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: my-application
          path: deploy/

      - name: Deploy to PROD
        run: |
          echo "Deploying ${{ vars.APP_NAME }} to PROD..."
          ls -R deploy/
          echo "PROD deployment successful!"
